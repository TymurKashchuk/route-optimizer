services:
  backend:
    build:
      context: .
      dockerfile: RouteWise.Api/Dockerfile
    container_name: routewise-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - EnableSwagger=${ENABLE_SWAGGER:-false}
      - ASPNETCORE_HTTP_PORTS=8080
      - OpenRouteService__ApiKey=${OPENROUTE_SERVICE_API_KEY:-}
      # Only the frontend (nginx) container may tell the API the real client IP
      - ForwardedHeaders__KnownProxies__0=172.28.0.10
    ports:
      - "5044:8080"
    networks:
      - routewise-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: routewise-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      routewise-network:
        ipv4_address: 172.28.0.10
    restart: unless-stopped

networks:
  routewise-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
